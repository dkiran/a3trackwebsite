# Veyro — nginx site config.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/veyro.com
#          sudo ln -s /etc/nginx/sites-available/veyro.com /etc/nginx/sites-enabled/
#          sudo certbot --nginx -d veyro.com -d www.veyro.com   (adds the TLS certificate lines)
#          sudo nginx -t && sudo systemctl reload nginx

# Redirect all HTTP to the canonical HTTPS host.
server {
    listen 80;
    listen [::]:80;
    server_name veyro.com www.veyro.com;
    location /.well-known/acme-challenge/ { root /var/www/veyro; }
    location / { return 301 https://veyro.com$request_uri; }
}

# Redirect www to the bare domain (one canonical host for SEO).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.veyro.com;
    ssl_certificate     /etc/letsencrypt/live/veyro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veyro.com/privkey.pem;
    return 301 https://veyro.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name veyro.com;

    ssl_certificate     /etc/letsencrypt/live/veyro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veyro.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/veyro;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Security headers (locations below use "expires", not add_header, so these are inherited everywhere)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/rss+xml application/manifest+json;

    # Fingerprinted build assets: cache for a year.
    location /_astro/ {
        expires 1y;
        access_log off;
    }

    # Images and icons: cache for a week.
    location ~* \.(png|jpg|jpeg|webp|avif|svg|ico|woff2)$ {
        expires 7d;
    }

    # Demo form -> local mail service.
    location /api/ {
        limit_except GET POST { deny all; }
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }

    # HTML: always revalidate so updates show immediately.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    error_page 404 /404.html;
}
