# Veyro — nginx site config.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/veyrotrack.com
#          sudo ln -s /etc/nginx/sites-available/veyrotrack.com /etc/nginx/sites-enabled/
#          sudo certbot --nginx -d veyrotrack.com -d www.veyrotrack.com   (adds the TLS certificate lines)
#          sudo nginx -t && sudo systemctl reload nginx

# Redirect all HTTP to the canonical HTTPS host.
server {
    listen 80;
    listen [::]:80;
    server_name veyrotrack.com www.veyrotrack.com;
    location /.well-known/acme-challenge/ { root /var/www/veyro; }
    location / { return 301 https://veyrotrack.com$request_uri; }
}

# Redirect www to the bare domain (one canonical host for SEO).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.veyrotrack.com;
    ssl_certificate     /etc/letsencrypt/live/veyrotrack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veyrotrack.com/privkey.pem;
    return 301 https://veyrotrack.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name veyrotrack.com;

    ssl_certificate     /etc/letsencrypt/live/veyrotrack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veyrotrack.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/veyro;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Security headers (locations below use "expires", not add_header, so these are inherited everywhere)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/rss+xml application/manifest+json;

    # Fingerprinted build assets: cache for a year.
    location /_astro/ {
        expires 1y;
        access_log off;
    }

    # Images and icons: cache for a week.
    location ~* \.(png|jpg|jpeg|webp|avif|svg|ico|woff2)$ {
        expires 7d;
    }

    # Contact form -> Veyro portal backend (saves the enquiry and emails it through ZeptoMail).
    location = /api/demo {
        limit_except POST { deny all; }
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:4000/api/public/enquiry;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    location /api/ { return 404; }

    # HTML: always revalidate so updates show immediately.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    error_page 404 /404.html;
}
