# A3Track — PREVIEW config: serves the site over plain HTTP on the server's IP address.
# Use this before the domain is purchased. Replace it with deploy/nginx.conf at launch.
# Install: sudo cp deploy/nginx-preview.conf /etc/nginx/sites-available/a3track-preview
#          sudo ln -sf /etc/nginx/sites-available/a3track-preview /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/a3track;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Keep the preview out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Demo form -> local mail service (only works once the mailer is set up).
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    error_page 404 /404.html;
}
