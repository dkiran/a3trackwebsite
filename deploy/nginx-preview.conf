# Veyro — PREVIEW config for a server that ALREADY hosts another website.
# Serves Veyro on its own port (8080) so the existing site on ports 80/443 is not touched.
# View it at http://YOUR-SERVER-IP:8080/  — replace with deploy/nginx.conf once the domain exists.
#
# Install: sudo cp deploy/nginx-preview.conf /etc/nginx/sites-available/veyro-preview
#          sudo ln -s /etc/nginx/sites-available/veyro-preview /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# (On Amazon Linux / RHEL, copy it to /etc/nginx/conf.d/veyro-preview.conf instead.)
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/veyro;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Keep the preview out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Contact form -> Veyro portal backend (saves the enquiry and emails it through ZeptoMail).
    location = /api/demo {
        limit_except POST { deny all; }
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:4000/api/public/enquiry;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    location /api/ { return 404; }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    error_page 404 /404.html;
}
